# Well-known native bindings registry (#466 Phase 4).
#
# Maps bare npm package names that Perry natively supports to the
# bundled wrapper crate that ships with the compiler. When a user
# writes `import { config } from 'dotenv'` and there's no
# `node_modules/dotenv/` on disk, this table is what Perry consults
# to find the implementation.
#
# Resolution precedence (see docs/src/native-libraries/manifest-v1.md):
#   1. node_modules/<name>/  with  perry.nativeLibrary  →  use it
#   2. node_modules/<name>/  without manifest           →  hard compile
#      error naming the package and pointing at
#      `perry.compilePackages` (Perry ships no JS runtime — see
#      `enforce_js_runtime_gate` in
#      crates/perry/src/commands/compile/bootstrap.rs)
#   3. well_known_bindings.toml (this file)             →  bundled crate
#   4. nothing matches                                  →  resolution error
#
# Adding an entry here:
#   - the `crate` value is the workspace member crate name (e.g.
#     `perry-ext-dotenv`); Perry derives the staticlib path as
#     `target/release/lib<crate-name-with-dashes-underscored>.a`.
#   - the wrapper crate must export the same `js_<package>_*`
#     symbols that perry-stdlib's existing implementation does, so
#     codegen-side dispatch keeps working unchanged.
#   - users can override an entry by installing their own wrapper
#     in `node_modules/<name>/` — that always wins.
#
# Migration order tracks #466 Phase 5 (smallest first). Each entry
# is gated on the bundled crate actually existing in the workspace
# — wrappers that haven't been ported yet have no entry.
#
# This file describes current resolver behavior, not permission to keep a
# package-specific Rust rewrite indefinitely. Before adding or removing a
# bundled crate, update its `migration` in `workspace-architecture.json`; CI
# requires every ext crate and package mapping to have an explicit decision
# (#5716).

[bindings.zlib]
crate = "perry-ext-zlib"
lib = "perry_ext_zlib"
tracking = "#466"
node-builtin = true

# NOTE: tursodb (#424) and iroh (#425) lived here through v0.5.556 but
# were moved out to standalone third-party repositories in v0.5.557:
#   - https://github.com/PerryTS/tursodb-bindings  → `bun add @perryts/tursodb`
#   - https://github.com/PerryTS/iroh-bindings     → `bun add @perryts/iroh`
# They were the demonstration cases of the "third-party native binding"
# hypothesis from #466. Now that the package.json `perry.nativeLibrary`
# resolution path is wired through (and the surface required is stable
# in perry-ffi v0.5), they belong outside the perry monorepo as separate
# npm packages users install on demand. The well-known table here keeps
# its job: bundling the wrappers that *port* perry-stdlib's existing
# in-tree implementations, not net-new functionality.

# `node-fetch` and the bare `fetch` alias deliberately have NO row here (P11).
#
# perry-ext-fetch defined the SAME 74 `js_fetch_*` / `js_headers_*` /
# `js_response_*` / `js_request_*` / `js_blob_*` / `js_form_data_*` symbols
# perry-stdlib owns, as a strict subset of them, and the two archives disagreed
# on how a handle is encoded: perry-stdlib NaN-boxes it with POINTER_TAG out of
# the fetch band, the wrapper returned a bare double counting from 1. A program
# that imported `node-fetch` AND called the global `fetch()` linked both (the
# flip strips `http-client`, but `compute_required_features` re-inserts
# `web-fetch`, which is the feature that actually gates the stdlib symbols), and
# whichever archive won the link decided whether the program SIGSEGV'd on
# `await fetch(...)` — `segfault at 5`, a handle id dereferenced as an object
# pointer. P8 measured it on `main` as well as on the turnloop branch.
#
# So `node-fetch` now routes to perry-stdlib's WHATWG fetch, which is a superset
# of what the wrapper implemented and which also gives node-fetch the things the
# wrapper never had: `AbortSignal` (#10325), `Content-Encoding` decoding,
# connection pooling, and P6's turnloop transport. `module_to_features` still
# maps `node-fetch` to `http-client`, which implies `web-fetch` — and with no
# row here nothing strips it, so the stdlib copy is required rather than
# optional. Restoring the two rows is all it takes to put the wrapper back.

# perry-ext-ws is Perry's own WebSocket engine, not an npm-package binding:
# it serves the global `WebSocket` client and the WebSocket hand-off of
# perry-ext-http's server. npm `ws` compiles from source (its row and upstream
# pin were removed), so the crate sits under a Perry-owned key no npm package
# can shadow. Nothing imports `perry/websocket`; the codegen symbol registry
# (`perry_codegen::ext_registry`) flips this row onto the link line whenever
# a program emits a `js_ws_*` call.
[bindings."perry/websocket"]
crate = "perry-ext-ws"
lib = "perry_ext_ws"
tracking = "#466"

[bindings.net]
crate = "perry-ext-net"
lib = "perry_ext_net"
tracking = "#466"
node-builtin = true

[bindings.http]
crate = "perry-ext-http"
lib = "perry_ext_http"
tracking = "#466"
node-builtin = true

[bindings.https]
crate = "perry-ext-http"
lib = "perry_ext_http"
tracking = "#466"
node-builtin = true

# Server-side `node:http2` lives in perry-ext-http's internal server
# module, so the staticlib binding stays uniform across http/https/http2.
[bindings.http2]
crate = "perry-ext-http"
lib = "perry_ext_http"
tracking = "#577"
node-builtin = true
